<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación | Sound And Color</title>
<style>
@font-face{font-family:Inter;src:url('assets/fonts/inter-400.ttf')}*{box-sizing:border-box}body{margin:0;background:#080c20;color:#ecfaff;font-family:Inter,Arial,sans-serif}#viewer{height:100vh;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(at top left,#103345,transparent 60%),#080c20}header,nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}a,button{color:inherit;font:inherit;font-size:14px;text-decoration:none;border:1px solid #ffffff30;background:#ffffff0c;border-radius:12px;padding:12px 16px;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #52dfff;outline-offset:3px}header strong{font-size:16px}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin:0 12px;touch-action:pan-y pinch-zoom}img{width:100%;height:100%;object-fit:contain;user-select:none}#status{position:absolute;background:#10152d;padding:12px;border-radius:10px}#status:empty{display:none}nav{justify-content:center;padding-bottom:max(14px,env(safe-area-inset-bottom))}#count{min-width:80px;text-align:center;font-size:14px}#next{background:linear-gradient(110deg,#137c9c,#793aca)}@media(max-width:550px){header{padding:10px;flex-wrap:wrap}header strong{display:none}a,button{padding:10px;font-size:14px}main{margin:0}nav{gap:8px}#count{min-width:65px}}
@media(pointer:coarse){#swipe-hint:not([hidden]){display:block}} #swipe-hint{display:none;text-align:center;color:#a5e8f5;font-size:14px;margin:8px 0 0} </style></head><body><section id="viewer"><header><a href="index.html">← Volver a la tarjeta</a><strong>Sound And Color</strong><a href="Presentacion-Sound-And-Color.pdf" download="Presentación SOUND AND COLOR.pdf" aria-label="Descargar presentación en PDF">Descargar presentación ↓</a><button id="fullscreen" type="button">Pantalla completa</button></header><main id="stage" aria-label="Diapositiva"><img id="slide" draggable="false" alt=""><div id="status" role="status"></div></main><p id="swipe-hint">← Desliza para ver más →</p><nav aria-label="Controles de presentación"><button id="prev" type="button">← Anterior</button><span id="count" aria-live="polite"></span><button id="next" type="button">Siguiente →</button></nav></section>
<script>
const slides=[{"src": "assets/slides/original-01.png"}, {"src": "assets/slides/original-02.png"}, {"src": "assets/slides/original-03.png"}, {"src": "assets/slides/original-04.png"}, {"src": "assets/slides/original-05.png"}, {"src": "assets/slides/original-06.png"}, {"src": "assets/slides/original-07.png"}, {"src": "assets/slides/original-08.png"}, {"src": "assets/slides/original-09.png"}, {"src": "assets/slides/original-10.png"}, {"src": "assets/slides/original-11.png"}, {"src": "assets/slides/original-12.png"}, {"src": "assets/slides/original-13.png"}, {"src": "assets/slides/original-14.png"}];let current=0;const picture=document.getElementById('slide'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),status=document.getElementById('status'),stage=document.getElementById('stage'),full=document.getElementById('fullscreen');
function show(n){if(n!==current){document.getElementById("swipe-hint").hidden=true;}current=Math.max(0,Math.min(slides.length-1,n));status.textContent='Cargando…';picture.alt=`Diapositiva ${current+1} de ${slides.length} — Sound And Color`;picture.src=slides[current].src;count.textContent=`${current+1} de ${slides.length}`;prev.disabled=current===0;next.disabled=current===slides.length-1;if(slides[current+1]){const preload=new Image();preload.src=slides[current+1].src;}}
picture.onload=()=>status.textContent='';picture.onerror=()=>status.textContent='No se pudo cargar la diapositiva. Vuelve a intentarlo con Anterior o Siguiente.';prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='Home'){e.preventDefault();show(0)}if(e.key==='End'){e.preventDefault();show(slides.length-1)}});
let start=null;stage.addEventListener('touchstart',e=>{start=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});stage.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)show(current+(dx<0?1:-1));start=null},{passive:true});stage.addEventListener('touchcancel',()=>start=null);
if(!document.fullscreenEnabled){full.hidden=true}else{full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById('viewer').requestFullscreen()}catch{status.textContent='La pantalla completa no está disponible en este navegador.'}};document.addEventListener('fullscreenchange',()=>full.textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa')}
show(0);
</script></body></html>
