<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación | Sound And Color</title>
<style>
@font-face{font-family:Inter;src:url('assets/fonts/inter-400.ttf')}*{box-sizing:border-box}body{margin:0;background:#080c20;color:#ecfaff;font-family:Inter,Arial,sans-serif}#viewer{height:100vh;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(at top left,#103345,transparent 60%),#080c20}header,nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}a,button{color:inherit;font:inherit;font-size:14px;text-decoration:none;border:1px solid #ffffff30;background:#ffffff0c;border-radius:12px;padding:12px 16px;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #52dfff;outline-offset:3px}header strong{font-size:16px}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin:0 12px;touch-action:pan-y pinch-zoom}img{width:100%;height:100%;object-fit:contain;user-select:none}#status{position:absolute;background:#10152d;padding:12px;border-radius:10px}#status:empty{display:none}nav{justify-content:center;padding-bottom:max(14px,env(safe-area-inset-bottom))}#count{min-width:80px;text-align:center;font-size:14px}#next{background:linear-gradient(110deg,#137c9c,#793aca)}@media(max-width:550px){header{padding:10px;flex-wrap:wrap}header strong{display:none}a,button{padding:10px;font-size:14px}main{margin:0}nav{gap:8px}#count{min-width:65px}}
@media(pointer:coarse){#swipe-hint:not([hidden]){display:block}} #swipe-hint{display:none;text-align:center;color:#a5e8f5;font-size:14px;margin:8px 0 0} 
#stage{overflow:auto;display:block;align-content:center;touch-action:pan-x pan-y pinch-zoom}#slide{display:block;margin:auto;max-width:none;max-height:none}#zoom-tools{display:flex;justify-content:center;gap:8px;padding:6px}#zoom-tools button{padding:8px 12px}.immersive header>a,.immersive header strong{display:none}.immersive header{justify-content:flex-end;padding:4px}.immersive #swipe-hint{display:none} @media(max-width:550px){header{gap:6px}header a,header button{font-size:12px;padding:8px}nav{padding:8px}#zoom-tools{padding:4px}}
</style></head><body><section id="viewer"><header><a href="index.html">← Volver a la tarjeta</a><strong>Sound And Color</strong><a href="Presentacion-Sound-And-Color.pdf" download="Presentación SOUND AND COLOR.pdf" aria-label="Descargar presentación en PDF">Descargar presentación ↓</a><button id="fullscreen" type="button">Pantalla completa</button></header><main id="stage" aria-label="Diapositiva"><img id="slide" draggable="false" alt=""><div id="status" role="status"></div></main><p id="swipe-hint">← Desliza para ver más →</p><div id="zoom-tools"><button id="zoom-out" aria-label="Reducir zoom">−</button><button id="zoom-fit">Ajustar</button><button id="zoom-in" aria-label="Aumentar zoom">+</button></div><nav aria-label="Controles de presentación"><button id="prev" type="button">← Anterior</button><span id="count" aria-live="polite"></span><button id="next" type="button">Siguiente →</button></nav></section>
<script>
const slides=[{"src": "assets/slides/original-01.webp"}, {"src": "assets/slides/original-02.webp"}, {"src": "assets/slides/original-03.webp"}, {"src": "assets/slides/original-04.webp"}, {"src": "assets/slides/original-05.webp"}, {"src": "assets/slides/original-06.webp"}, {"src": "assets/slides/original-07.webp"}, {"src": "assets/slides/original-08.webp"}, {"src": "assets/slides/original-09.webp"}, {"src": "assets/slides/original-10.webp"}, {"src": "assets/slides/original-11.webp"}, {"src": "assets/slides/original-12.webp"}, {"src": "assets/slides/original-13.webp"}, {"src": "assets/slides/original-14.webp"}];let current=0;const picture=document.getElementById('slide'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),status=document.getElementById('status'),stage=document.getElementById('stage'),full=document.getElementById('fullscreen');
function show(n){if(n!==current){document.getElementById("swipe-hint").hidden=true;}current=Math.max(0,Math.min(slides.length-1,n));status.textContent='Cargando…';picture.alt=`Diapositiva ${current+1} de ${slides.length} — Sound And Color`;picture.src=slides[current].src;count.textContent=`${current+1} de ${slides.length}`;prev.disabled=current===0;next.disabled=current===slides.length-1;if(slides[current+1]){const preload=new Image();preload.src=slides[current+1].src;}}
picture.onload=()=>{status.textContent='';layoutSlide()};picture.onerror=()=>status.textContent='No se pudo cargar la diapositiva. Vuelve a intentarlo con Anterior o Siguiente.';prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='Home'){e.preventDefault();show(0)}if(e.key==='End'){e.preventDefault();show(slides.length-1)}});
let start=null;stage.addEventListener('touchstart',e=>{start=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});stage.addEventListener('touchend',e=>{if(!start||zoom>1)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)show(current+(dx<0?1:-1));start=null},{passive:true});stage.addEventListener('touchcancel',()=>start=null);

let zoom=1;
function layoutSlide(){if(!picture.naturalWidth)return;const factor=Math.min(stage.clientWidth/picture.naturalWidth,stage.clientHeight/picture.naturalHeight)*zoom;picture.style.width=`${picture.naturalWidth*factor}px`;picture.style.height=`${picture.naturalHeight*factor}px`;document.getElementById('zoom-fit').textContent=zoom===1?'Ajustar':`${Math.round(zoom*100)} %`;}
function setZoom(value){zoom=Math.max(1,Math.min(4,value));layoutSlide();}
document.getElementById('zoom-in').onclick=()=>setZoom(zoom+.5);document.getElementById('zoom-out').onclick=()=>setZoom(zoom-.5);document.getElementById('zoom-fit').onclick=()=>setZoom(1);
new ResizeObserver(layoutSlide).observe(stage);
const viewer=document.getElementById('viewer');
function fallback(){viewer.classList.toggle('immersive');full.textContent=viewer.classList.contains('immersive')?'Salir de vista ampliada':'Pantalla completa';requestAnimationFrame(layoutSlide);}
full.hidden=false;full.onclick=async()=>{if(viewer.classList.contains('immersive')){fallback();return}try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.fullscreenEnabled&&viewer.requestFullscreen)await viewer.requestFullscreen();else fallback()}catch{fallback()}};
document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';requestAnimationFrame(layoutSlide)});

show(0);
</script></body></html>
